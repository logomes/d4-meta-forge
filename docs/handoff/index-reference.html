<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>D4 Meta Forge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=Oswald:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #0b0907; }
    body { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
    ::selection { background: rgba(232, 200, 96, 0.3); }

    /* slim themed scrollbar */
    *::-webkit-scrollbar { width: 11px; height: 11px; }
    *::-webkit-scrollbar-track { background: transparent; }
    *::-webkit-scrollbar-thumb { background: #352a20; border-radius: 999px; border: 3px solid transparent; background-clip: content-box; }
    *::-webkit-scrollbar-thumb:hover { background: #4a3b2c; background-clip: content-box; }

    /* range thumbs */
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none;
      width: 15px; height: 15px; border-radius: 999px;
      background: var(--accent, #e8c860);
      border: 2px solid #0b0907;
      box-shadow: 0 0 8px var(--accent-glow, rgba(232,200,96,.5));
      cursor: pointer; margin-top: -5px;
    }
    input[type="range"]::-moz-range-thumb {
      width: 14px; height: 14px; border-radius: 999px;
      background: var(--accent, #e8c860); border: 2px solid #0b0907; cursor: pointer;
    }
    select option { background: #16110d; color: #ece2d3; }

    @media (max-width: 920px) {
      .detail-grid, .lab-grid, .cmp-grid { grid-template-columns: 1fr !important; }
    }
    @media (max-width: 560px) {
      .skill-grid { grid-template-columns: 1fr !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <template id="__bundler_thumbnail">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <rect width="100" height="100" fill="#0b0907" />
      <path d="M50 18c6 16-9 22-9 38 0 0-9-6-9-15-9 9-12 18-12 27a30 30 0 0 0 60 0c0-18-15-27-21-39-3 6-6 9-9 12 0-9 3-15 9-21-3 0-6 1-9 3z" fill="#e8c860" />
    </svg>
  </template>

  <!-- React + Babel (pinned) -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- data (plain) -->
  <script src="app/data.js"></script>

  <!-- tweaks + views + app (babel) -->
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="app/forge-ui.jsx"></script>
  <script type="text/babel" src="app/view-hub.jsx"></script>
  <script type="text/babel" src="app/view-detail.jsx"></script>
  <script type="text/babel" src="app/view-lab.jsx"></script>
  <script type="text/babel" src="app/view-compare.jsx"></script>
  <script type="text/babel" src="app/view-forge.jsx"></script>
  <script type="text/babel" src="app/app.jsx"></script>

  <style id="__om-edit-overrides"></style>
</body>
</html>
